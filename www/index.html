<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no" />
  <meta http-equiv="Content-Security-Policy" content="default-src * 'self' 'unsafe-inline' 'unsafe-eval' data: blob: mediastream:; img-src * data: blob:; media-src * data: blob:; connect-src *; script-src * 'unsafe-inline' 'unsafe-eval';" />
  <title>LOLLIFLIX PRO</title>
  <link rel="stylesheet" href="css/styles.css" />
  <style>:root { --tb-h: 0px; } html, body { height: 100%; width: 100%; } body { overflow: hidden; background: #0a0810; }</style>
</head>
<body>
  <div id="appbg"></div>
  <div id="app"></div>

  <div id="player">
    <video id="videoEl" playsinline></video>
    <div id="playerSpinner" class="spinner-lg"></div>
    <div id="playerError"></div>
    <button id="miniX" class="mini-x" title="Fechar">&#10005;</button>
    <div class="mini-hint">Toque para ampliar</div>
    <div id="playerBar">
      <button class="pl-btn" id="plBack" title="Voltar">&#8592;</button>
      <div id="playerTitle"></div>
      <div class="pl-spacer"></div>
      <button class="pl-btn" id="plPlay" title="Play/Pause">&#9654;&#10073;&#10073;</button>
      <button class="pl-btn" id="plMute" title="Mudo">&#128266;</button>
      <button class="pl-btn" id="plFull" title="Tela cheia">&#9974;</button>
    </div>
  </div>

  <div id="toast"></div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/hls.js/1.5.17/hls.min.js"></script>
  <script src="js/net.js"></script>
  <script src="js/config.js"></script>
  <script src="js/store.js"></script>
  <script src="js/tmdb.js"></script>
  <script src="js/api.js"></script>
  <script src="js/player.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
